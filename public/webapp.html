<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAP</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1 class="brand__title">MAP</h1>
        <p class="brand__subtitle">Металлопрокат и химическая продукция</p>
      </div>
      <div class="badge">В наличии и под заказ</div>
    </div>

    <section class="hero glass-card">
      <h2 class="hero__title">Поставка металлопроката и химической продукции</h2>
      <p class="hero__text">
        Подберём нужную позицию со склада или под заказ. Отправьте параметры заявки — менеджер свяжется с вами.
      </p>
    </section>

    <section class="section">
      <h3 class="section__title">Категории</h3>

      <div class="grid">
        <button class="tile" data-category="Круги">Круги</button>
        <button class="tile" data-category="Швеллера">Швеллера</button>
        <button class="tile" data-category="Листы">Листы</button>
        <button class="tile" data-category="Трубы">Трубы</button>
        <button class="tile" data-category="Арматура">Арматура</button>
        <button class="tile" data-category="Каустическая сода">Каустическая сода</button>
      </div>
    </section>

    <section class="section">
      <h3 class="section__title">Оставить заявку</h3>

      <div class="glass-card form-card">
        <div class="form-stack">
          <input id="name" class="input" type="text" placeholder="Ваше имя" />
          <input id="phone" class="input" type="tel" placeholder="Телефон" />
          <input id="product" class="input" type="text" placeholder="Товар" />
          <input id="size" class="input" type="text" placeholder="Размер / марка / фасовка" />
          <input id="quantity" class="input" type="text" placeholder="Количество" />
          <input id="city" class="input" type="text" placeholder="Город доставки" />
          <textarea id="comment" class="textarea" placeholder="Комментарий"></textarea>

          <div class="btn-row">
            <button id="sendBtn" class="btn btn--primary" type="button">Отправить заявку</button>
            <button id="contactBtn" class="btn btn--secondary" type="button">Связаться с менеджером</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
